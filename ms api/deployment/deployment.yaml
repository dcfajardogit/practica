apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-api-deployment
  labels:
    app: ms-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-api
  template:
    metadata:
      labels:
        app: ms-api
    spec:
      containers:
        - name: api-container
          # image: ms_api:1.0 para pruebas contenerizadas con kubernetes
          image: 928975674404.dkr.ecr.us-east-1.amazonaws.com/practice-repo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
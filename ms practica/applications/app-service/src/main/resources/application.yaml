server:
  port: 8080
spring:
  application:
    name: "plataforma"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    #url: "http://localhost:8081/api/orders" #para pruebas sin contenerización
    #url: "http://host.docker.internal:8081/api/orders" #pruebas contenerizadas sin archivo service
    #url: "http://ms-api-service:8081/api/orders" #para pruebas con kubernetes local y service tipo NodePort
    url: "http://accf5be83dc924d488ccc98992160c36-757254021.us-east-1.elb.amazonaws.com/api/orders"
resilience4j:
  circuitbreaker:
    instances:
      orders:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"

apiVersion: v1
kind: Service
metadata:
  name: practica-service
spec:
  type: LoadBalancer
  selector:
    app: practica
  ports:
    - protocol: TCP
      port: 80 # Puerto interno del servicio (lo que los clientes usan)
      targetPort: 8080 # Puerto donde el contenedor escucha
      nodePort: 31530 # Puerto expuesto en el nodo (entre 30000-32767)